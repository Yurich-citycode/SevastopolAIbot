# Sevastopol Alive Maps — полностью локальный стек.
#
#   data/                 сюда кладём .osm.pbf (см. make data) — общий том для трёх сервисов
#   graphhopper  :8989    пеший роутинг + Custom Model + areas
#   tileserver   :8081    раздача наших тайлов (mbtiles) и шрифтов
#   backend      :8080    FastAPI: прокси тайлов, /api/route, /api/compare, фронтенд
#
# Первый запуск:  make data && make tiles && docker compose up --build
# Дальше просто:  docker compose up
#
# Никаких внешних карт и ключей в рантайме: тайлы и маршруты считаются локально.

services:

  # ---------- GraphHopper: пешие маршруты ----------
  graphhopper:
    build:
      context: ./graphhopper
      args:
        GH_VERSION: ${GH_VERSION:-11.1}
    container_name: alive-gh
    restart: unless-stopped
    command: ["server", "/app/config.yml"]
    environment:
      JAVA_OPTS: "-Xmx${GH_MEMORY:-2g} -Dfile.encoding=UTF-8"
      PBF: /data/sevastopol.osm.pbf
    volumes:
      - ./data:/data
      - ./graphhopper/config.yml:/app/config.yml:ro
    healthcheck:
      # импорт графа на первом старте занимает минуты — поэтому start_period большой
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  # ---------- TileServer GL: наши тайлы ----------
  tileserver:
    image: maptiler/tileserver-gl:${TS_VERSION:-latest}
    container_name: alive-tiles
    restart: unless-stopped
    command: ["--config", "/data/config.json", "--port", "8080", "--verbose"]
    volumes:
      - ./data:/data
      - ./tiles/config.json:/data/config.json:ro
    ports:
      # наружу не обязательно, но удобно для отладки: http://localhost:8081/data/sevastopol/13/4863/2963.pbf
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Backend + фронтенд ----------
  backend:
    build: ./backend
    container_name: alive-api
    restart: unless-stopped
    environment:
      GH_URL: http://graphhopper:8989
      TS_URL: http://tileserver:8080
      ZONES_FILE: /data/zones.geojson
      DATA_DIR: /data
      CACHE_TTL: ${CACHE_TTL:-900}
      GH_PROFILE: foot
    volumes:
      - ./data:/data:ro
      - ./tiles:/tiles:ro
    ports:
      - "${PORT:-8080}:8000"
    depends_on:
      graphhopper:
        condition: service_healthy
      tileserver:
        condition: service_started

  # ---------- Planetiler: генерация тайлов (одноразовый запуск) ----------
  #   docker compose run --rm planetiler
  planetiler:
    image: ghcr.io/onthegomap/planetiler:${PLANETILER_VERSION:-latest}
    profiles: ["build"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${PLANETILER_MEMORY:-4g}"
    volumes:
      - ./data:/data
    command:
      - --osm-path=/data/sevastopol.osm.pbf
      - --output=/data/sevastopol.mbtiles
      - --maxzoom=15
      - --bounds=33.30,44.28,33.85,44.78
      - --download
      - --force
